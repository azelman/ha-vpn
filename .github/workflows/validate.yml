name: Validate app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script
        uses: koalaman/shellcheck-action@v2
        with:
          scandir: ikev2-client

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Check YAML files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path); puts "OK: #{path}" }' \
            repository.yaml ikev2-client/config.yaml \
            ikev2-client/translations/en.yaml .github/workflows/validate.yml

      - name: Check executable and required app files
        run: |
          test -x ikev2-client/run.sh
          test -f ikev2-client/Dockerfile
          test -f ikev2-client/config.yaml
          test -f ikev2-client/apparmor.txt
          test ! -e ikev2-client/build.yaml

  image:
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: ikev2-client
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=ci
          push: false
