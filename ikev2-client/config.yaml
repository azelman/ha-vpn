name: IKEv2 VPN Client
version: "1.0.1"
slug: ikev2_client
description: Connect the Home Assistant host to a remote IKEv2/IPsec VPN
url: https://github.com/azelman/ha-vpn
image: ghcr.io/azelman/ha-vpn
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
apparmor: true
host_network: true
privileged:
  - NET_ADMIN
map:
  - type: addon_config
    read_only: true
options:
  server: "vpn.example.com"
  server_id: "vpn.example.com"
  authentication: certificate
  client_id: "vpnclient"
  p12_file: "vpnclient.p12"
  p12_password: ""
  username: ""
  password: ""
  pre_shared_key: ""
  server_ca_file: ""
  remote_subnets: "0.0.0.0/0"
  ike_proposals: ""
  esp_proposals: ""
  force_udp_encapsulation: false
  reconnect_interval: 300
  log_level: info
schema:
  server: "match(^[A-Za-z0-9][A-Za-z0-9._:-]*$)"
  server_id: str
  authentication: list(certificate|eap-mschapv2|psk)
  client_id: str?
  p12_file: str?
  p12_password: password?
  username: str?
  password: password?
  pre_shared_key: password?
  server_ca_file: str?
  remote_subnets: str
  ike_proposals: str?
  esp_proposals: str?
  force_udp_encapsulation: bool
  reconnect_interval: int(10,3600)
  log_level: list(error|warning|info|debug)
